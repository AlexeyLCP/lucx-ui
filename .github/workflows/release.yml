name: Release LucX-UI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "**.sh"
      - "frontend/**"
      - "x-ui.service.debian"
      - "x-ui.service.arch"
      - "x-ui.service.rhel"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "**.sh"
      - "frontend/**"
      - "x-ui.service.debian"
      - "x-ui.service.arch"
      - "x-ui.service.rhel"
      - ".github/workflows/release.yml"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      # One platform hitting a transient outage must not cancel the other six.
      fail-fast: false
      matrix:
        platform:
          - amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # Frontend dist must be built BEFORE go build — Go's //go:embed
      # all:dist directive in internal/web/web.go requires internal/web/dist/ to exist
      # at compile time. internal/web/dist/ is .gitignored, so on a fresh CI
      # checkout it doesn't exist until vite emits it.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Build LucX-UI
        run: |
          CURL_RETRY="--retry 5 --retry-all-errors --retry-delay 3"
          fetch() { wget -q --tries=5 --waitretry=10 --retry-on-http-error=429,500,502,503 "$@"; }
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=${{ matrix.platform }}
          # Use Bootlin prebuilt cross-toolchains (musl 1.2.5 in stable series)
          case "${{ matrix.platform }}" in
            amd64) BOOTLIN_ARCH="x86-64" ;;
          esac
          echo "Resolving Bootlin musl toolchain for arch=$BOOTLIN_ARCH (platform=${{ matrix.platform }})"
          TARBALL_BASE="https://toolchains.bootlin.com/downloads/releases/toolchains/$BOOTLIN_ARCH/tarballs/"
          TARBALL_URL=$(curl -fsSL $CURL_RETRY "$TARBALL_BASE" | grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\\.tar\\.xz" | sort -r | head -n1)
          [ -z "$TARBALL_URL" ] && { echo "Failed to locate Bootlin musl toolchain for arch=$BOOTLIN_ARCH" >&2; exit 1; }
          echo "Downloading: $TARBALL_URL"
          cd /tmp
          curl -fL -sS $CURL_RETRY -o "$(basename "$TARBALL_URL")" "$TARBALL_BASE/$TARBALL_URL"
          tar -xf "$(basename "$TARBALL_URL")"
          TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)
          export PATH="$(realpath "$TOOLCHAIN_DIR")/bin:$PATH"
          export CC=$(realpath "$(find "$TOOLCHAIN_DIR/bin" -name '*-gcc.br_real' -type f -executable | head -n1)")
          [ -z "$CC" ] && { echo "No gcc.br_real found in $TOOLCHAIN_DIR/bin" >&2; exit 1; }
          cd -
          # Stamp the commit into per-commit (dev channel) builds only; tagged
          # stable releases stay unstamped so config.IsDevBuild() returns false.
          LDFLAGS="-w -s -linkmode external -extldflags '-static'"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            LDFLAGS="$LDFLAGS -X github.com/mhsanaei/3x-ui/v3/internal/config.buildCommit=${GITHUB_SHA::8} -X github.com/mhsanaei/3x-ui/v3/internal/config.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          else
            # LUCX-HOOK: derive the LucX suffix from the tag (v3.5.0-lucx.33 ->
            # lucx.33) and inject it, so the released binary always matches its
            # tag. Fail the release when the source default was not bumped —
            # that desync would make local builds lie about their version.
            TAG_LUCX="${GITHUB_REF_NAME##*-}"
            SRC_LUCX=$(grep -oP 'var lucxVersion = "\Klucx\.\d+(?=")' internal/config/config.go)
            if [[ -z "$TAG_LUCX" || "$TAG_LUCX" != "$SRC_LUCX" ]]; then
              echo "Tag suffix '${TAG_LUCX}' != lucxVersion '${SRC_LUCX}' in internal/config/config.go" >&2
              echo "Bump lucxVersion to match the tag, commit, and re-tag." >&2
              exit 1
            fi
            LDFLAGS="$LDFLAGS -X github.com/mhsanaei/3x-ui/v3/internal/config.lucxVersion=${TAG_LUCX}"
          fi
          go build -ldflags "$LDFLAGS" -o xui-release -v main.go
          file xui-release
          ldd xui-release || echo "Static binary confirmed"

          mkdir x-ui
          cp xui-release x-ui/
          cp x-ui.service.debian x-ui/
          cp x-ui.service.arch x-ui/
          cp x-ui.service.rhel x-ui/
          cp x-ui.sh x-ui/
          mv x-ui/xui-release x-ui/x-ui
          mkdir x-ui/bin
          # LUCX-HOOK: AWG — DKMS install script for the amneziawg kernel module.
          cp bin/install-awg-module.sh x-ui/bin/ || true
          cd x-ui/bin

          # Download dependencies
          Xray_URL="https://github.com/XTLS/Xray-core/releases/download/v26.7.28/"
          if [ "${{ matrix.platform }}" == "amd64" ]; then
            fetch ${Xray_URL}Xray-linux-64.zip
            unzip Xray-linux-64.zip
            rm -f Xray-linux-64.zip
          elif [ "${{ matrix.platform }}" == "arm64" ]; then
            fetch ${Xray_URL}Xray-linux-arm64-v8a.zip
            unzip Xray-linux-arm64-v8a.zip
            rm -f Xray-linux-arm64-v8a.zip
          elif [ "${{ matrix.platform }}" == "armv7" ]; then
            fetch ${Xray_URL}Xray-linux-arm32-v7a.zip
            unzip Xray-linux-arm32-v7a.zip
            rm -f Xray-linux-arm32-v7a.zip
          elif [ "${{ matrix.platform }}" == "armv6" ]; then
            fetch ${Xray_URL}Xray-linux-arm32-v6.zip
            unzip Xray-linux-arm32-v6.zip
            rm -f Xray-linux-arm32-v6.zip
          elif [ "${{ matrix.platform }}" == "386" ]; then
            fetch ${Xray_URL}Xray-linux-32.zip
            unzip Xray-linux-32.zip
            rm -f Xray-linux-32.zip
          elif [ "${{ matrix.platform }}" == "armv5" ]; then
            fetch ${Xray_URL}Xray-linux-arm32-v5.zip
            unzip Xray-linux-arm32-v5.zip
            rm -f Xray-linux-arm32-v5.zip
          elif [ "${{ matrix.platform }}" == "s390x" ]; then
            fetch ${Xray_URL}Xray-linux-s390x.zip
            unzip Xray-linux-s390x.zip
            rm -f Xray-linux-s390x.zip
          fi
          rm -f geoip.dat geosite.dat
          fetch https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          fetch https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          fetch -O geoip_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat
          fetch -O geosite_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat
          fetch -O geoip_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat
          fetch -O geosite_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat
          # LUCX-HOOK: RoscomVPN custom geo (RKN geoblock lists)
          fetch -O geoip_ROSCOM.dat https://github.com/hydraponique/roscomvpn-geoip/releases/latest/download/geoip.dat
          fetch -O geosite_ROSCOM.dat https://github.com/hydraponique/roscomvpn-geosite/releases/latest/download/geosite.dat
          # END LUCX-HOOK
          mv xray xray-linux-${{ matrix.platform }}
          # mtg-multi (MTProto sidecar) ships prebuilt release binaries whose
          # platform labels match our matrix, so download and unpack the matching
          # archive. Only the platforms the fork publishes are packaged — the tag
          # lookup lives inside that branch so unpackaged platforms (s390x) never
          # depend on it. The tag comes from the release-page redirect on
          # github.com — the host the downloads need anyway — because api.github.com
          # has 503'd whole release runs while asset downloads kept working.
          case "${{ matrix.platform }}" in
            amd64|arm64|armv7|armv6|386)
              MTG_MULTI_VER=$(curl -sf $CURL_RETRY -o /dev/null -w '%{redirect_url}' "https://github.com/mhsanaei/mtg-multi/releases/latest" | sed -n 's#.*/releases/tag/##p')
              if [ -z "$MTG_MULTI_VER" ]; then echo "could not resolve the latest mtg-multi release tag"; exit 1; fi
              MTG_PKG="mtg-multi-${MTG_MULTI_VER#v}-linux-${{ matrix.platform }}"
              curl -sfLRO $CURL_RETRY "https://github.com/mhsanaei/mtg-multi/releases/download/${MTG_MULTI_VER}/${MTG_PKG}.tar.gz"
              tar -xzf "${MTG_PKG}.tar.gz"
              mv "${MTG_PKG}/mtg-multi" "mtg-linux-${{ matrix.platform }}"
              rm -rf "${MTG_PKG}" "${MTG_PKG}.tar.gz"
              ;;
          esac
          # LUCX-HOOK: NaiveProxy tunnel sidecar — Caddy with klzgrad's
          # forward_proxy plugin (naive branch, HTTP/2 padding). amd64 ships
          # the upstream prebuilt binary (pinned tag); arm64 cross-compiles
          # the same plugin set via xcaddy (caddy is pure Go). Other matrix
          # platforms get no binary — the Tunnels page shows "not installed"
          # and offers upload/download there.
          CADDY_NAIVE_TAG="v2.11.2-naive"
          if [ "${{ matrix.platform }}" == "amd64" ]; then
            fetch -O caddy-naive.tar.xz "https://github.com/klzgrad/forwardproxy/releases/download/${CADDY_NAIVE_TAG}/caddy-forwardproxy-naive.tar.xz"
            tar -xJf caddy-naive.tar.xz
            mv caddy-forwardproxy-naive/caddy caddy-naive-linux-amd64
            rm -rf caddy-forwardproxy-naive caddy-naive.tar.xz
          elif [ "${{ matrix.platform }}" == "arm64" ]; then
            go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
            CGO_ENABLED=0 "$(go env GOPATH)/bin/xcaddy" build \
              --with github.com/caddyserver/forwardproxy=github.com/klzgrad/forwardproxy@naive \
              --output caddy-naive-linux-arm64
          fi
          # NaiveProxy CLIENT (klzgrad/naiveproxy Chromium) for sidecar
          # outbounds. Distinct from caddy-naive (server). ~3.3 MB xz.
          if [ "${{ matrix.platform }}" == "amd64" ] || [ "${{ matrix.platform }}" == "arm64" ]; then
            NAIVE_CLIENT_TAG="v150.0.7871.63-1"
            case "${{ matrix.platform }}" in
              amd64) NAIVE_CLIENT_ARCH="linux-x64" ;;
              arm64) NAIVE_CLIENT_ARCH="linux-arm64" ;;
            esac
            NAIVE_CLIENT_XZ="naiveproxy-${NAIVE_CLIENT_TAG}-${NAIVE_CLIENT_ARCH}.tar.xz"
            fetch -O "${NAIVE_CLIENT_XZ}" "https://github.com/klzgrad/naiveproxy/releases/download/${NAIVE_CLIENT_TAG}/${NAIVE_CLIENT_XZ}"
            mkdir -p /tmp/naiveclient
            tar -xJf "${NAIVE_CLIENT_XZ}" -C /tmp/naiveclient
            NAIVE_CLIENT_BIN=$(find /tmp/naiveclient -type f -name naive | head -n1)
            if [ -z "$NAIVE_CLIENT_BIN" ]; then echo "naive missing from ${NAIVE_CLIENT_XZ}"; exit 1; fi
            mv "$NAIVE_CLIENT_BIN" "naive-client-linux-${{ matrix.platform }}"
            chmod +x "naive-client-linux-${{ matrix.platform }}"
            rm -rf /tmp/naiveclient "${NAIVE_CLIENT_XZ}"
          fi
          # olcRTC (openlibrecommunity/olcrtc, WTFPL) — TCP-over-WebRTC
          # tunnel. Built from source with GOTOOLCHAIN=auto so the module's
          # required Go version is pulled automatically. amd64/arm64 only;
          # other arches use the Tunnels page upload/download path.
          # PINNED, never unpinned master: upstream PR #140 (merged
          # 2026-08-13) replaced the crypto wire format with the OLC2
          # record layer (HKDF directional keys, "OLC2" framing, replay
          # window) with NO fallback, breaking every existing client app
          # (owenclave/olcbox builds predating it). 3339cd36 is the last
          # master commit before that merge; lucx.112-118 shipped it and
          # Telemost was verified working. Move the pin only when client
          # apps ship OLC2 builds (and test a real room end-to-end first).
          if [ "${{ matrix.platform }}" == "amd64" ] || [ "${{ matrix.platform }}" == "arm64" ]; then
            OLCRTC_REF="3339cd36716885e583429f97e73462cde4984e2e"
            git init -q /tmp/olcrtc
            git -C /tmp/olcrtc remote add origin https://github.com/openlibrecommunity/olcrtc.git
            git -C /tmp/olcrtc fetch -q --depth 1 origin "${OLCRTC_REF}"
            git -C /tmp/olcrtc checkout -q FETCH_HEAD
            ( cd /tmp/olcrtc && GOTOOLCHAIN=auto CGO_ENABLED=0 GOOS=linux GOARCH="${{ matrix.platform }}" \
                go build -trimpath -ldflags="-s -w" -o "/tmp/olcrtc-linux-${{ matrix.platform }}" ./cmd/olcrtc )
            mv "/tmp/olcrtc-linux-${{ matrix.platform }}" "olcrtc-linux-${{ matrix.platform }}"
            rm -rf /tmp/olcrtc
          fi
          # qWDTT (SpaceNeuroX/proxy-turn-vk-android server.go, GPL-3.0) —
          # WireGuard over VK TURN. Single-file server with many deps; we
          # ship the prebuilt from Bebrik2283555/Ex3-ui (same binary, renamed
          # extra-qwdtt → qwdtt-linux-{arch}) so CI does not have to pin a
          # fragile go.mod. amd64/arm64 only.
          if [ "${{ matrix.platform }}" == "amd64" ] || [ "${{ matrix.platform }}" == "arm64" ]; then
            EX3_TAG="v1.0"
            EX3_TGZ="x-ui-linux-${{ matrix.platform }}.tar.gz"
            fetch -O "${EX3_TGZ}" "https://github.com/Bebrik2283555/Ex3-ui/releases/download/${EX3_TAG}/${EX3_TGZ}"
            tar -xzf "${EX3_TGZ}" "x-ui/bin/extra-qwdtt"
            mv x-ui/bin/extra-qwdtt "qwdtt-linux-${{ matrix.platform }}"
            chmod +x "qwdtt-linux-${{ matrix.platform }}"
            rm -rf x-ui "${EX3_TGZ}"
          fi
          # mieru (enfein/mieru, GPL-3.0) — mita server. Built from a pinned
          # tag; BinaryName() is mieru-linux-{arch}. amd64/arm64 only.
          if [ "${{ matrix.platform }}" == "amd64" ] || [ "${{ matrix.platform }}" == "arm64" ]; then
            MIERU_REF="v3.35.0"
            git clone --depth 1 --branch "${MIERU_REF}" https://github.com/enfein/mieru.git /tmp/mieru
            ( cd /tmp/mieru && GOTOOLCHAIN=auto CGO_ENABLED=0 GOOS=linux GOARCH="${{ matrix.platform }}" \
                go build -trimpath -ldflags="-s -w" -o "/tmp/mieru-linux-${{ matrix.platform }}" ./cmd/mita )
            mv "/tmp/mieru-linux-${{ matrix.platform }}" "mieru-linux-${{ matrix.platform }}"
            chmod +x "mieru-linux-${{ matrix.platform }}"
            ( cd /tmp/mieru && GOTOOLCHAIN=auto CGO_ENABLED=0 GOOS=linux GOARCH="${{ matrix.platform }}" \
                go build -trimpath -ldflags="-s -w" -o "/tmp/mieru-client-linux-${{ matrix.platform }}" ./cmd/mieru )
            mv "/tmp/mieru-client-linux-${{ matrix.platform }}" "mieru-client-linux-${{ matrix.platform }}"
            chmod +x "mieru-client-linux-${{ matrix.platform }}"
            rm -rf /tmp/mieru
          fi
          # TrustTunnel (TrustTunnel/TrustTunnel, Apache-2.0) — prebuilt
          # trusttunnel_endpoint from the official tarball. amd64=x86_64,
          # arm64=aarch64. Other arches use Cores-tab upload.
          if [ "${{ matrix.platform }}" == "amd64" ] || [ "${{ matrix.platform }}" == "arm64" ]; then
            TT_VER="v1.0.33"
            case "${{ matrix.platform }}" in
              amd64) TT_ARCH="x86_64" ;;
              arm64) TT_ARCH="aarch64" ;;
            esac
            TT_TGZ="trusttunnel-${TT_VER}-linux-${TT_ARCH}.tar.gz"
            fetch -O "${TT_TGZ}" "https://github.com/TrustTunnel/TrustTunnel/releases/download/${TT_VER}/${TT_TGZ}"
            mkdir -p /tmp/trusttunnel
            tar -xzf "${TT_TGZ}" -C /tmp/trusttunnel
            TT_BIN=$(find /tmp/trusttunnel -type f -name trusttunnel_endpoint | head -n1)
            if [ -z "$TT_BIN" ]; then echo "trusttunnel_endpoint missing from ${TT_TGZ}"; exit 1; fi
            mv "$TT_BIN" "trusttunnel-linux-${{ matrix.platform }}"
            chmod +x "trusttunnel-linux-${{ matrix.platform }}"
            rm -rf /tmp/trusttunnel "${TT_TGZ}"
            TT_CLIENT_VER="v1.0.49"
            TT_CLIENT_TGZ="trusttunnel_client-${TT_CLIENT_VER}-linux-${TT_ARCH}.tar.gz"
            fetch -O "${TT_CLIENT_TGZ}" "https://github.com/TrustTunnel/TrustTunnelClient/releases/download/${TT_CLIENT_VER}/${TT_CLIENT_TGZ}"
            mkdir -p /tmp/ttclient
            tar -xzf "${TT_CLIENT_TGZ}" -C /tmp/ttclient
            TT_CLIENT_BIN=$(find /tmp/ttclient -type f -name trusttunnel_client | head -n1)
            if [ -z "$TT_CLIENT_BIN" ]; then echo "trusttunnel_client missing from ${TT_CLIENT_TGZ}"; exit 1; fi
            mv "$TT_CLIENT_BIN" "trusttunnel-client-linux-${{ matrix.platform }}"
            chmod +x "trusttunnel-client-linux-${{ matrix.platform }}"
            rm -rf /tmp/ttclient "${TT_CLIENT_TGZ}"
          fi
          # END LUCX-HOOK
          cd ../..

      - name: Package
        run: tar -zcvf x-ui-linux-${{ matrix.platform }}.tar.gz x-ui

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: x-ui-linux-${{ matrix.platform }}
          path: ./x-ui-linux-${{ matrix.platform }}.tar.gz

      - name: Upload files to GH release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: x-ui-linux-${{ matrix.platform }}.tar.gz
          asset_name: x-ui-linux-${{ matrix.platform }}.tar.gz
          overwrite: true
          # LUCX-HOOK: publish tagged builds as stable, not pre-release, so
          # /releases/latest resolves to our newest lucx tag — install.sh and
          # the panel's stable update channel both read that endpoint.
          # Upstream's Windows build job is intentionally not ported: AWG needs
          # the amneziawg Linux kernel module.
          prerelease: false
          # END LUCX-HOOK

  # =================================
  #  Rolling dev channel (per-commit)
  # =================================
  # Publishes/overwrites the build artifacts to a single fixed-tag pre-release
  # `dev-latest`, force-moved to the new commit on every push to main. The panel's
  # "Dev" update channel installs from this tag. `--latest=false` is load-bearing:
  # it keeps releases/latest pointing at the real stable tag, so the stable
  # channel is unaffected.
  publish-dev:
    name: Publish rolling dev release
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize racing pushes; never cancel an in-flight upload, or the dev
    # release could be left with a partial asset set.
    concurrency:
      group: dev-release
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dev-artifacts
          merge-multiple: true

      - name: Publish dev-latest pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          set -e
          retry() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt $i failed: ${*:1:3}" >&2
              sleep $((i * 5))
            done
            return 1
          }
          short="${COMMIT::8}"
          notes="Rolling development build — installs via the panel's Dev update channel.

          commit=${COMMIT}
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          Automated per-commit build from main. Not a stable release."

          # Force-move the dev-latest tag to this commit so the release tracks it.
          git tag -f dev-latest "${COMMIT}"
          retry git push -f origin refs/tags/dev-latest

          # The release exists on every run but the first; edit-first avoids an
          # existence probe that can 503 and mis-route into create (422).
          if ! retry gh release edit dev-latest --prerelease --latest=false \
              --title "Dev build ${short}" --notes "${notes}"; then
            retry gh release create dev-latest --prerelease --latest=false \
              --target "${COMMIT}" --title "Dev build ${short}" --notes "${notes}"
          fi

          # LUCX-HOOK: only Linux tarballs — the fork does not publish the
          # upstream Windows build (AWG is a Linux kernel module, so a Windows
          # panel cannot run the sidecar at all). Upstream's glob also lists
          # dev-artifacts/*.zip, which would fail here with no zip artifact.
          retry gh release upload dev-latest dev-artifacts/*.tar.gz --clobber
          # END LUCX-HOOK
